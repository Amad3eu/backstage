name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-test:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'

      # A imagem ubuntu-slim não traz o Yarn, e o setup-node precisa dele no
      # PATH para localizar o cache. O Corepack vem com o Node e resolve isso.
      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run quality check
        run: yarn quality:check

      - name: Run tests
        run: yarn test:all
